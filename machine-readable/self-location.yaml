entity_type: "registry protocol and initial public registry node"

definition:
  one_sentence: "The operational registry layer that receives public Index Manifests, checks source and stated authority, records registry decisions, preserves accepted manifests, and creates searchable entries pointing to canonical Self-Location Records."
  expanded: "This repository implements the intake and indexing layer defined by the AI Foundations Self-Location Standard. It is an initial public registry node, not the universal owner or source of the records it indexes."

claims:
  - "A Self-Location Record remains at its canonical source."
  - "An Index Manifest is the compact summary submitted for registry intake."
  - "Registry acceptance does not transfer authorship, ownership, or authority."
  - "Multiple registry nodes may participate in a federated indexing system."

does_not_claim:
  - "This repository owns submitted records."
  - "This repository verifies every factual claim in every record."
  - "This repository is the only registry node that may exist."
  - "Acceptance constitutes endorsement or certification."
  - "Indexed entities become AI Foundations canon."

